#:schema node_modules/wrangler/config-schema.json
name = "calibrator-edge"
main = "src/index.ts"
compatibility_date = "2024-08-21"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "calibrator-edge.alvgaona.dev", custom_domain = true }]

[[queues.producers]]
queue = "calibrator-calibrate"
binding = "CALIBRATOR_CALIBRATE"
