name: Deploy Workers

on:
    push:
        branches:
            - main
            - master
        paths:
            - "packages/**"

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            calibrate: ${{ steps.changes.outputs.calibrate }}
            upload: ${{ steps.changes.outputs.upload }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      calibrate:
                        - 'packages/calibrate/**'
                      upload:
                        - 'packages/upload/**'

    deploy-calibrate:
        needs: detect-changes
        if: needs.detect-changes.outputs.calibrate == 'true'
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4

            - name: Create GitHub deployment
              uses: chrnorm/deployment-action@v2
              id: deployment
              with:
                  token: ${{ github.token }}
                  environment: production
                  description: Deploy calibrate worker

            - name: Update deployment status (in progress)
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: in_progress

            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile

            - name: Deploy to Cloudflare
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: packages/calibrate
                  command: deploy

            - name: Update deployment status (success)
              if: success()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: success
                  environment-url: https://calibrator-calibrate.alvgaona.dev

            - name: Update deployment status (failure)
              if: failure()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: failure

    deploy-upload:
        needs: detect-changes
        if: needs.detect-changes.outputs.upload == 'true'
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4

            - name: Create GitHub deployment
              uses: chrnorm/deployment-action@v2
              id: deployment
              with:
                  token: ${{ github.token }}
                  environment: production
                  description: Deploy upload worker

            - name: Update deployment status (in progress)
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: in_progress

            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile

            - name: Deploy to Cloudflare
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: packages/upload
                  command: deploy

            - name: Update deployment status (success)
              if: success()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: success
                  environment-url: https://calibrator-upload.alvgaona.dev

            - name: Update deployment status (failure)
              if: failure()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: failure
