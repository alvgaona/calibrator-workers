name: Test

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First trigger build
  build:
    name: Trigger Build
    uses: ./.github/workflows/build.yml

  test-all:
    name: Test All Workspaces
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run all tests
        run: bun test

  test-edge:
    name: Test Edge Worker
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       contains(github.event.pull_request.labels.*.name, 'edge') ||
       contains(github.event.pull_request.title, 'edge'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Edge build artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-build-artifacts
          path: apps/edge/dist

      - name: Run Edge tests
        run: bun turbo test --filter=@calibrator/edge

  test-unpack:
    name: Test Unpack Worker
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       contains(github.event.pull_request.labels.*.name, 'unpack') ||
       contains(github.event.pull_request.title, 'unpack'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Unpack build artifacts
        uses: actions/download-artifact@v4
        with:
          name: unpack-build-artifacts
          path: apps/unpack/target/wasm32-unknown-unknown/release

      - name: Run Unpack tests
        run: bun turbo test --filter=@calibrator/unpack

  test-upload:
    name: Test Upload Worker
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       contains(github.event.pull_request.labels.*.name, 'upload') ||
       contains(github.event.pull_request.title, 'upload'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Upload build artifacts
        uses: actions/download-artifact@v4
        with:
          name: upload-build-artifacts
          path: apps/upload/dist

      - name: Run Upload tests
        run: bun turbo test --filter=@calibrator/upload
