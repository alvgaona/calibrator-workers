name: build

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-all-workspaces
    runs-on: ubuntu-latest
    steps:
      - name: checkout-repository
        uses: actions/checkout@v4

      - name: setup-rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: install-dependencies
        run: bun install --frozen-lockfile

      - name: build-all-workspaces
        run: bun run build
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: dummy-project-id
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: dummy-publishable-key
          STACK_SECRET_SERVER_KEY: dummy-secret-key

      - name: upload-build-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
            apps/unpack/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 1
