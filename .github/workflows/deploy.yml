name: deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.changes.outputs.edge }}
      upload: ${{ steps.changes.outputs.upload }}
      unpack: ${{ steps.changes.outputs.unpack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            edge:
              - 'apps/edge/**'
            upload:
              - 'apps/upload/**'
            unpack:
              - 'apps/unpack/**'

  deploy-edge:
    needs: detect-changes
    if: needs.detect-changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: create-github-deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          description: Deploy edge worker

      - name: update-deployment-status-in-progress
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: in_progress

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: deploy-to-cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/edge
          command: deploy

      - name: update-deployment-status-success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://calibrator-edge.alvgaona.dev

      - name: update-deployment-status-failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

  deploy-upload:
    needs: detect-changes
    if: needs.detect-changes.outputs.upload == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: create-github-deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          description: Deploy upload worker

      - name: update-deployment-status-in-progress
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: in_progress

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: deploy-to-cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/upload
          command: deploy

      - name: update-deployment-status-success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://calibrator-upload.alvgaona.dev

      - name: update-deployment-status-failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

  deploy-unpack:
    needs: detect-changes
    if: needs.detect-changes.outputs.unpack == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: create-github-deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          description: Deploy unpack worker

      - name: update-deployment-status-in-progress
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: in_progress

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: deploy-to-cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/unpack
          command: deploy

      - name: update-deployment-status-success
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success

      - name: update-deployment-status-failure
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
