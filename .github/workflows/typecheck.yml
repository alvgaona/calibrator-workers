name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-all:
    name: Type Check All Workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check all workspaces
        run: bun typecheck

  typecheck-edge:
    name: Type Check Edge Worker
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       contains(github.event.pull_request.labels.*.name, 'edge') ||
       contains(github.event.pull_request.title, 'edge'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check Edge Worker
        run: bun turbo typecheck --filter=@calibrator/edge

  typecheck-upload:
    name: Type Check Upload Worker
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && 
       contains(github.event.pull_request.labels.*.name, 'upload') ||
       contains(github.event.pull_request.title, 'upload'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check Upload Worker
        run: bun turbo typecheck --filter=@calibrator/upload
