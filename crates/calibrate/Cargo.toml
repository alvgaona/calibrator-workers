[package]
name = "calibrate"
version = "0.0.1"
edition = "2021"
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
repository = "https://github.com/alvgaona/calibrator-workers"
license = "AGPL-3.0, GPL-3.0"
description = "A worker to trigger the calibration process"

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.3.4", features = ["http", "axum"] }
worker-macros = { version = "0.3.4", features = ["http"] }
console_error_panic_hook = { version = "0.1.1" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4.50"
axum = { version = "0.8.4", default-features = false, features = ["json"] }
tower-service = "0.3.3"
aws-sdk-sqs = "1.73.0"
aws-config = { version = "1.8.0", features = ["behavior-version-latest"] }
